# Enable Vi mode
set-window-option -g mode-keys vi
# Setup 'v' to begin selection, just like Vim
bind-key -T copy-mode-vi v send-keys -X begin-selection
# Setup 'y' to yank (copy), just like Vim
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
# Update the default binding of 'Enter' to use copy-selection-and-cancel
unbind-key -T copy-mode-vi Enter
bind-key -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel

# Mouse selection, pane resizing, and scrolling
set -g mouse on

# Keep plenty of agent output
set -g history-limit 100000

# Better colors in kitty
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB"

# Start window and pane numbers at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Easier pane creation, preserving the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Reload this configuration
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"
